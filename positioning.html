<!DOCTYPE html>
   <html>
    <head>
        <style>
            div {
                right:30px
               border:3px solid black;  
            }
            div.sticky {
                position: sticky;
                top: 1px;
                left: 20px;
                width: 300px;
                border:3px solid blue;
            }
            div.relative {
                position: relative;
                top: 10px;
                left: 20px;
                width: 300px;
                border:3px solid green;
            }
            div.absolute {
                position: absolute;
                top: 10px;
                left: 20px;
                width: 300px;
                border:3px solid red;
            }
            div.fixed {
                position: fixed;
                top: 10px;
                left: 20px;
                width: 300px;
                border:3px solid purple;
            }
        </style>
      <body>
            <h2>POSITIONING</h2>
            <div>
                Div with no position property
            </div> 
            <div class="sticky">
                Div with sticky position property
            </div>
            <div class="relative">
                Div with relative position property
            </div>
            <div class="absolute">
                Div with absolute position property
            </div>
            <div class="fixed">
            
                Div with fixed position property
            
            </div>
