<!DOCTYPE html>
<html>

<head>
    <title>Function Declaration</title>
</head>

<body>
    <center>
        <h1 style="color: #ff0000;">Codingal Education</h1>
        <h3>Function Declaration</h3>
        <script>

           var result = function (a, b) { return a * b };
            document.write(result(5, 8));

            var result = function (a, b) { return a + b };
                document.write(result(49, 35));

                 var result = function (a, b) { return a - b };
                    document.write(result(53, 27));

                    var result = function (a, b) { return a / b };
                    document.write(result(105, 7));



        </script>
    </center>
</body>

</html>
