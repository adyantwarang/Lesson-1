<html>
    <head>
        <style>
             div { 
                background-color: orangered;
                padding:10px;
            }
            div.first {
                opacity: 0.1;
            }
            div.second {
                opacity: 0.3;
            }
            div.third {
                opacity: 0.6;
            }
              div.fourth {
                opacity: 1.0;
            }
        </style>
    </head>
    <body>

        <h1>the opacity property</h1>

        <p>This is how this property works:</p>

        <div class="first"><p>opacity 0.1</p></div>
        <div class="second"><p>opacity 0.3</p></div>
        <div class="third"><p>opacity 0.6</p></div>
    </body>
</html>
