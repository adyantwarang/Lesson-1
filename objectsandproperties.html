<!DOCTYPE html>
<html>
    <body>
        <h2> JavaScript Objects and its Properties</h2>
        <p>there are two different ways to access an object's property</p>

        <p>you can use .property or [property_name]</p>

        <p id="demo"></p>
        <script>
            // Create an object
            var person = {
                firstName: "Adyant",
                age: "11",
              
                
             };
            // Display some data from the object:
            document.getElementById("demo").innerHTML = person.firstName + " is " + person.age + " years old ";
        </script>
    </body>
</html>
